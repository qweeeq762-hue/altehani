<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب التهاني للإلكترونيات</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .main-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
            border: 1px solid #222;
        }
        .placeholder-box {
            background: linear-gradient(135deg, #1e1e1e, #111);
            border: 2px dashed #d4af37;
            padding: 30px 15px;
            border-radius: 12px;
            color: #d4af37;
            font-size: 18px;
            font-weight: bold;
        }
        h1 {
            color: #d4af37;
            font-size: 22px;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #aaa;
            font-size: 14px;
            margin-top: 0;
        }
        .btn-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }
        .btn-call {
            background-color: #25d366;
            color: #fff;
        }
        .btn-host1 {
            background-color: #e67e22;
            color: #fff;
        }
        .btn-host2 {
            background-color: #0088cc;
            color: #fff;
        }
        .terminal {
            background: #000;
            color: #00ff00;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #222;
        }
    </style>
</head>
<body>

    <div class="container">
