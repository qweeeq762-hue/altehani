<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب التهاني للإلكترونيات</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 15px 10px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #141414;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #222;
        }
        .main-img {
            width: 100%;
            height: auto;
            max-height: 250px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
            display: block;
        }
        h1 {
            color: #d4af37;
            font-size: 22px;
            margin: 0 0 8px 0;
        }
        p.subtitle {
            color: #aaa;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-call {
            background-color: #25d366;
            color: #fff;
        }
        .btn-host {
            background-color: #0078d4;
            color: #fff;
            border: 1px solid #005a9e;
        }
        /* نافذة مدمجة لفتح سيرفر ZEKOxao مباشرة داخل الموقع */
        .host-frame-container {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #000;
            overflow: hidden;
            margin-top: 15px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة المكتب -->
        <img src="1000185437.jpg" alt="مكتب التهاني للإلكترونيات" class="main-img">
        
        <h1>مكتب التهاني للإلكترونيات</h1>
        <p class="subtitle">صيانة وبرمجة اللابتوبات وأجهزة الألعاب - الموصل</p>

        <div class="btn-container">
            <!-- زر الاتصال -->
            <a href="tel:07705255538" class="btn btn-call">📞 اتصل بالمكتب: 07705255538</a>
            
            <!-- زر فتح موقع ZEKOxao بنافذة خارجية مجاورة -->
            <a href="https://zekoxao.github.io/" target="_blank" class="btn btn-host">🚀 فتح سيرفر ZEKOxao بصفحة مستقلة</a>
        </div>

        <!-- شاشة مدمجة لسيرفر ZEKOxao تعمل مباشرة بالأسفل -->
        <div class="host-frame-container">
            <iframe src="https://zekoxao.github.io/" title="ZEKOxao Host"></iframe>
        </div>
    </div>

</body>
</html>
