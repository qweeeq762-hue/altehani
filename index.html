<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب التهاني للإلكترونيات</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .main-img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        h1 {
            color: #d4af37;
            font-size: 20px;
            margin: 5px 0;
        }
        p.subtitle {
            color: #aaa;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .btn-call {
            display: block;
            background-color: #25d366;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }
        /* نافذة تهكير بلايستيشن المدمجة مباشرة بالواجهة */
        .host-frame-container {
            width: 100%;
            height: 450px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة المكتب -->
        <img src="1000185437.jpg" alt="مكتب التهاني للإلكترونيات" class="main-img" onerror="this.style.display='none'">
        
        <h1>مكتب التهاني للإلكترونيات</h1>
        <p class="subtitle">صيانة وبرمجة اللابتوبات وأجهزة الألعاب - الموصل</p>

        <!-- زر الاتصال -->
        <a href="tel:07705255538" class="btn-call">📞 اتصل بالمكتب: 07705255538</a>

        <!-- واجهة موقع التهكير مدمجة هنا مباشرة -->
        <div class="host-frame-container">
            <iframe src="https://wolf218.ir/" title="PS4 Host"></iframe>
        </div>
    </div>

</body>
</html>
